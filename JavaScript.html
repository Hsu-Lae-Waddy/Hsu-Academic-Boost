<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIT Course</title>
  <link rel="icon" type="image/png" href="LogoHAB-removebg-preview.png">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Source Sans 3', sans-serif; box-sizing: border-box; }
    code, .mono { font-family: 'JetBrains Mono', monospace; }
    .sidebar-item { transition: all 0.15s; }
    .sidebar-item:hover { background: #2d3748; }
    .sidebar-item.active { background: #1a73e8; color: #fff; }
    .code-block { 
      background: #1e1e2e; 
      color: #cdd6f4; 
      border-radius: 8px; 
      padding: 16px; 
      overflow-x: auto; 
      white-space: pre; 
      font-size: 0.85rem; 
      line-height: 1.6; 
      margin: 1rem 0;
      tab-size: 2;
    }
    .code-block .keyword { color: #cba6f7; }
    .code-block .string { color: #a6e3a1; }
    .code-block .comment { color: #6c7086; font-style: italic; }
    .code-block .type { color: #89b4fa; }
    .code-block .function { color: #fab387; }
  </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full bg-gray-900 text-gray-100">
  <div class="flex h-full w-full">
   <!-- Sidebar -->
   <aside id="sidebar" class="w-64 min-w-[256px] bg-gray-800 border-r border-gray-700 overflow-y-auto flex-shrink-0 hidden md:block">
    <div class="p-5 border-b border-gray-700">
       <div class="flex items-center gap-3 mb-3">
          <button onclick="goHome()" class="hover:bg-gray-700 p-1.5 rounded transition" title="Go Home">
            <i data-lucide="home" class="w-5 h-5"></i>
          </button>
          <h1 id="site-title" class="text-lg font-bold text-emerald-400 mono flex-1"> MIT App Inventor</h1>
        </div>
    </div>
    <nav class="py-2" id="nav-list"></nav>
   </aside>
   <!-- Mobile menu button --> 
   <button id="mobile-menu-btn" class="md:hidden fixed top-3 left-3 z-50 bg-gray-800 p-2 rounded-lg border border-gray-700 hover:bg-gray-700 transition"> 
    <i data-lucide="menu" class="w-5 h-5"></i> 
   </button> 
   <!-- Mobile overlay -->
   <div id="mobile-overlay" class="hidden fixed inset-0 bg-black/60 z-40 md:hidden" onclick="toggleMobile()"></div>
<aside id="mobile-sidebar" class="fixed left-0 top-0 h-full w-64 bg-gray-800 z-50 overflow-y-auto md:hidden shadow-2xl transform -translate-x-full transition-transform duration-300">    <div class="p-5 border-b border-gray-700 flex justify-between items-center">
     <div class="flex items-center gap-3">
       <button onclick="goHome()" class="hover:bg-gray-700 p-1.5 rounded transition" title="Go Home">
         <i data-lucide="home" class="w-5 h-5"></i>
       </button>
       <h1 class="text-lg font-bold text-emerald-400 mono">MIT App Inventor</h1>
     </div>
     <button onclick="toggleMobile()" class="hover:bg-gray-700 p-1.5 rounded transition">
      <i data-lucide="x" class="w-5 h-5"></i>
     </button>
    </div>
    <nav class="py-2" id="mobile-nav-list"></nav>
   </aside>
   <!-- Main Content -->
   <main class="flex-1 overflow-y-auto p-6 md:p-10" id="main-content"></main>
  </div>
  <script>
    const lessons = [
      // 🟡 BEGINNER LEVEL
   
{
  title: "🟡 JavaScript Introduction",
  content: `
    <h2>JavaScript Introduction</h2>

    <p>
      <strong>JavaScript</strong> is a programming language used to make websites
      interactive and dynamic. It allows websites to respond when users click
      buttons, type information, submit forms, or perform other actions.
    </p>

    <h3>1. What Is JavaScript?</h3>
    <p>
      Imagine you are visiting a website. You can see text, pictures, buttons,
      animations, and menus. But what makes those buttons work when you click them?
      What displays a message when you submit a form?
    </p>
    <p>
      <strong>JavaScript makes these interactions possible!</strong>
    </p>

    <h3>2. HTML, CSS, and JavaScript</h3>
    <p>Most websites use three important technologies:</p>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Technology</th>
            <th>Purpose</th>
            <th>Example</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>HTML</strong></td>
            <td>Creates the structure and content.</td>
            <td>Headings, paragraphs, buttons.</td>
          </tr>
          <tr>
            <td><strong>CSS</strong></td>
            <td>Controls the appearance and design.</td>
            <td>Colors, fonts, spacing, layouts.</td>
          </tr>
          <tr>
            <td><strong>JavaScript</strong></td>
            <td>Adds behavior and interactivity.</td>
            <td>Click actions, messages, animations.</td>
          </tr>
        </tbody>
      </table>
    </div>

    <h3>3. A Simple Example</h3>
    <p>
      Let's imagine a button on a website. HTML creates the button,
      CSS makes it look attractive, and JavaScript makes something happen
      when the user clicks it.
    </p>

    <div class="code-block"><pre><code>&lt;button onclick="alert('Hello, Student!')"&gt;
  Click Me!
&lt;/button&gt;</code></pre></div>

    <p><strong>What happens?</strong></p>
    <ol>
      <li>HTML creates a button.</li>
      <li>The user clicks the button.</li>
      <li>JavaScript displays a pop-up message saying "Hello, Student!"</li>
    </ol>

    <h3>4. What Can JavaScript Do?</h3>
    <ul>
      <li>Display messages and notifications.</li>
      <li>Respond to button clicks.</li>
      <li>Check information entered into forms.</li>
      <li>Create interactive games and quizzes.</li>
      <li>Change webpage content without reloading the page.</li>
      <li>Build animations and interactive effects.</li>
      <li>Communicate with servers and retrieve data.</li>
    </ul>

    <h3>5. Where Does JavaScript Run?</h3>
    <p>
      JavaScript commonly runs inside web browsers such as Google Chrome,
      Microsoft Edge, Firefox, and Safari.
    </p>
    <p>
      It can also run outside the browser using environments such as
      <strong>Node.js</strong>, which allows developers to build server-side
      applications and other tools.
    </p>

    <h3>6. How to Add JavaScript to HTML</h3>
    <p>There are three common ways to add JavaScript to an HTML page.</p>

    <h4>Method 1: Inline JavaScript</h4>
    <p>Write JavaScript directly inside an HTML element.</p>
    <div class="code-block"><pre><code>&lt;button onclick="alert('Welcome!')"&gt;
  Click Me
&lt;/button&gt;</code></pre></div>

    <h4>Method 2: Internal JavaScript</h4>
    <p>Write JavaScript inside a <code>&lt;script&gt;</code> tag in the HTML file.</p>
    <div class="code-block"><pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;title&gt;My First JavaScript&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;

  &lt;h1&gt;Welcome!&lt;/h1&gt;

  &lt;script&gt;
    alert("Hello, World!");
  &lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;</code></pre></div>

    <h4>Method 3: External JavaScript</h4>
    <p>
      Write JavaScript in a separate <code>.js</code> file and connect it
      to your HTML file.
    </p>
    <p><strong>index.html</strong></p>
    <div class="code-block"><pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;
  &lt;title&gt;My Website&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;

  &lt;h1&gt;My First Website&lt;/h1&gt;

  &lt;script src="script.js"&gt;&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre></div>

    <p><strong>script.js</strong></p>
    <div class="code-block"><pre><code>alert("Hello from JavaScript!");</code></pre></div>

    <p>
      <strong>Remember:</strong> The <code>src</code> attribute connects
      the external JavaScript file to the HTML page. A common practice is
      to place this script tag near the end of the body or use
      <code>defer</code> in the head.
    </p>

    <h3>7. Your First JavaScript Program</h3>
    <p>
      Let's write a simple JavaScript program that displays a message
      in the browser's developer console.
    </p>

    <div class="code-block"><pre><code>console.log("Hello, World!");
console.log("Welcome to JavaScript!");
console.log("I am learning programming.");</code></pre></div>

    <p><strong>Output in the browser console:</strong></p>
    <div class="output-box">
      Hello, World!<br>
      Welcome to JavaScript!<br>
      I am learning programming.</div>

    <p>
      <code>console.log()</code> is commonly used by programmers to display
      information and check what is happening in their code.
    </p>

    <h3>8. JavaScript Is Case-Sensitive</h3>
    <p>
      JavaScript is case-sensitive. This means uppercase and lowercase
      letters are treated differently.
    </p>
    <div class="code-block"> <pre><code>let student = "Alex";

console.log(student);  // Works

// console.log(Student); // Error: Student is different</code></pre></div>

    <h3>9. Summary</h3>
    <ul>
      <li>JavaScript is a programming language.</li>
      <li>It makes websites interactive and dynamic.</li>
      <li>HTML creates the structure of a webpage.</li>
      <li>CSS controls the design and appearance.</li>
      <li>JavaScript controls behavior and interactions.</li>
      <li>JavaScript can be added inline, internally, or externally.</li>
      <li><code>console.log()</code> displays information in the console.</li>
    </ul>

    <h3>10. Try It Yourself!</h3>
    <p>Complete these beginner activities:</p>
    <ol>
      <li>Display "Hello, World!" using <code>console.log()</code>.</li>
      <li>Display your name in the browser console.</li>
      <li>Create an HTML button that displays a welcome message when clicked.</li>
      <li>Create an external JavaScript file and connect it to an HTML page.</li>
    </ol>

    <h3>🧠 Quick Knowledge Check</h3>
    <ol>
      <li>What is JavaScript used for?</li>
      <li>Which technology creates the structure of a webpage?</li>
      <li>Which technology controls the appearance of a webpage?</li>
      <li>Which technology makes a webpage interactive?</li>
      <li>What does <code>console.log()</code> do?</li>
      <li>What is the file extension of an external JavaScript file?</li>
    </ol>
  `
},

    ];

    let currentLesson = 0;

    function buildNav(container) {
      container.innerHTML = '';
      lessons.forEach((lesson, i) => {
        const item = document.createElement('div');
        item.className = `sidebar-item px-5 py-2.5 cursor-pointer text-sm text-gray-300 ${i === currentLesson ? 'active' : ''}`;
        item.textContent = lesson.title;
        item.onclick = () => { currentLesson = i; renderAll(); toggleMobile(false); };
        container.appendChild(item);
      });
    }

    function renderContent() {
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <article class="max-w-3xl mx-auto lesson-content">
          ${lessons[currentLesson].content}
          <div class="flex justify-between mt-10 pt-6 border-t border-gray-700">
            ${currentLesson > 0 ? `<button onclick="nav(-1)" class="flex items-center gap-2 px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm"><i data-lucide="chevron-left" class="w-4 h-4"></i> Previous</button>` : '<span></span>'}
            ${currentLesson < lessons.length - 1 ? `<button onclick="nav(1)" class="flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm">Next <i data-lucide="chevron-right" class="w-4 h-4"></i></button>` : '<span></span>'}
          </div>
        </article>
        <style>
          .lesson-content h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; color: #6ee7b7; }
          .lesson-content h3 { font-size: 1.2rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #a7f3d0; }
          .lesson-content p { margin-bottom: 1rem; line-height: 1.7; color: #d1d5db; }
          .lesson-content ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
          .lesson-content li { margin-bottom: 0.4rem; color: #d1d5db; line-height: 1.6; }
          .lesson-content ol { padding-left: 1.5rem; margin-bottom: 1rem; }
          .lesson-content code { background: #374151; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; color: #a5b4fc; }
          .lesson-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; background: #1f2937; border-radius: 0.5rem; overflow: hidden; }
          .lesson-content th, .lesson-content td { border: 1px solid #4b5563; padding: 0.75rem 1rem; text-align: left; }
          .lesson-content th { background: #374151; font-weight: 600; }
          .lesson-content a { color: #34d399; }
          .lesson-content a:hover { text-decoration: underline; }
        </style>
      `;
      lucide.createIcons();
    }

    function renderAll() {
      buildNav(document.getElementById('nav-list'));
      buildNav(document.getElementById('mobile-nav-list'));
      renderContent();
    }

    // All functions properly exposed
    window.nav = function(dir) { 
      currentLesson += dir; 
      renderAll(); 
      document.getElementById('main-content').scrollTop = 0; 
    };

    window.goHome = function() { window.location.href = 'index.html'; };

    window.toggleMobile = function(force) {
      const sidebar = document.getElementById('mobile-sidebar');
      const overlay = document.getElementById('mobile-overlay');
      const show = force !== undefined ? force : !sidebar.classList.contains('hidden');
      sidebar.classList.toggle('hidden', !show);
      overlay.classList.toggle('hidden', !show);
    };

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('mobile-menu-btn').onclick = () => toggleMobile();
      renderAll();
      lucide.createIcons();
    });

    // SDK
    const defaultConfig = { 
      site_title: 'Python Course', 
      primary_color: '#10b981', 
      surface_color: '#1f2937', 
      text_color: '#d1d5db', 
      accent_color: '#6ee7b7', 
      bg_color: '#111827', 
      font_family: 'Source Sans 3', 
      font_size: 16 
    };

    function applyConfig(config) {
      document.getElementById('site-title').textContent = config.site_title || defaultConfig.site_title;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => applyConfig(config),
        mapToCapabilities: (config) => ({
          recolorables: [
            { get: () => config.bg_color || defaultConfig.bg_color, set: (v) => { config.bg_color = v; window.elementSdk.setConfig({ bg_color: v }); } },
            { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
            { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
            { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } }
          ],
          borderables: [],
          fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
          fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
        }),
        mapToEditPanelValues: (config) => new Map([["site_title", config.site_title || defaultConfig.site_title]])
      });
    }
    function toggleMobile(){

  const sidebar = document.getElementById("mobile-sidebar");
  const overlay = document.getElementById("mobile-overlay");

  // OPEN
  if(sidebar.classList.contains("-translate-x-full")){

    sidebar.classList.remove("-translate-x-full");

    overlay.classList.remove("hidden");

  }

  // CLOSE
  else{

    sidebar.classList.add("-translate-x-full");

    overlay.classList.add("hidden");

  }

}

  </script>
 </body>
</html>
