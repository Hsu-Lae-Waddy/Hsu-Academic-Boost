    </p>

    <h3>📝 Example</h3>

    <div class="code-block">class Student:

    def __init__(self, name, age):
        self.name = name
        self.age = age

  title: "🔴 Self Parameter",
  content: `
    <h2>Python <code>self</code> Parameter</h2>

    <p>
      The <code>self</code> parameter refers to the <strong>current object</strong> of a class.
    </p>

    <p>
      It allows an object to access its own <strong>attributes</strong> and <strong>methods</strong>.
    </p>

    <hr>

    <h3>🏠 Real-Life Example</h3>

    <p>
      Imagine a classroom with many students.
    </p>

    <table>
      <tr>
        <th>Student</th>
        <th>Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>student1</td>
        <td>Alice</td>
        <td>18</td>
      </tr>
      <tr>
        <td>student2</td>
        <td>Bob</td>
        <td>20</td>
      </tr>
    </table>

    <p>
      Each student has their own information.
      <code>self</code> tells Python <strong>which object</strong> it is working with.
    </p>

    <hr>

    <h3>📝 Example</h3>

    <div class="code-block">class Student:

    def __init__(self, name, age):
        self.name = name
        self.age = age</div>

    <p>
      Here:
    </p>

    <ul>
      <li><code>self.name</code> stores the student's name.</li>
      <li><code>self.age</code> stores the student's age.</li>
    </ul>

    <hr>

    <h3>📌 Creating Objects</h3>

    <div class="code-block">student1 = Student("Alice", 18)
student2 = Student("Bob", 20)</div>

    <p>
      Each object has its own values.
    </p>

    <table>
      <tr>
        <th>Object</th>
        <th>self.name</th>
        <th>self.age</th>
      </tr>
      <tr>
        <td>student1</td>
        <td>Alice</td>
        <td>18</td>
      </tr>
      <tr>
        <td>student2</td>
        <td>Bob</td>
        <td>20</td>
      </tr>
    </table>

    <hr>

    <h3>📌 Accessing Attributes</h3>

    <div class="code-block">print(student1.name)
print(student2.age)</div>

    <strong>Output</strong>

    <div class="code-block">Alice
20 </div>

    <hr>

    <h3>📌 Using <code>self</code> in Methods</h3>

    <div class="code-block">class Student:

    def __init__(self, name):
        self.name = name

    def introduce(self):
        print("Hello, my name is", self.name)

student = Student("Alice")
student.introduce()</div>

    <strong>Output</strong>

    <div class="code-block">Hello, my name is Alice </div>

    <p>
      Inside the <code>introduce()</code> method,
      <code>self.name</code> gets the name of the current object.
    </p>

    <hr>

    <h3>❓ Can We Use Another Name?</h3>

    <p>
      Yes. The first parameter can have any valid name, but by convention Python programmers use <code>self</code>.
    </p>

    <div class="code-block">class Student:

    def __init__(myobject, name):
        myobject.name = name</div>

    <p>
      This code works, but using <code>self</code> is the recommended and standard practice.
    </p>

    <hr>

    <h3>🧠 Easy Memory Trick</h3>

    <table>
      <tr>
        <th>Word</th>
        <th>Meaning</th>
      </tr>
      <tr>
        <td><code>self</code></td>
        <td>Me / This Object</td>
      </tr>
    </table>

    <p>
      Think of <code>self</code> as saying:
      <strong>"Use my own data."</strong>
    </p>

    <hr>

    <h3>📚 Summary</h3>

    <table>
      <tr>
        <th>Concept</th>
        <th>Description</th>
      </tr>
      <tr>
        <td><code>self</code></td>
        <td>Refers to the current object.</td>
      </tr>
      <tr>
        <td><code>self.name</code></td>
        <td>Stores or accesses the object's name.</td>
      </tr>
      <tr>
        <td><code>self.age</code></td>
        <td>Stores or accesses the object's age.</td>
      </tr>
      <tr>
        <td>Convention</td>
        <td>Always use <code>self</code> as the first parameter.</td>
      </tr>
    </table>

    <p>
      <code>self</code> allows each object to keep and use its own data, making it possible to create many independent objects from the same class.
    </p>
  `
}

        </style>
      `;
      lucide.createIcons();
    }

    function renderAll() {
      buildNav(document.getElementById('nav-list'));
      buildNav(document.getElementById('mobile-nav-list'));
      renderContent();
    }

    // All functions properly exposed
    window.nav = function(dir) { 
      currentLesson += dir; 
      renderAll(); 
      document.getElementById('main-content').scrollTop = 0; 
    };

    window.goHome = function() { window.location.href = 'index.html'; };

    window.toggleMobile = function(force) {
      const sidebar = document.getElementById('mobile-sidebar');
      const overlay = document.getElementById('mobile-overlay');
      const show = force !== undefined ? force : !sidebar.classList.contains('hidden');
      sidebar.classList.toggle('hidden', !show);
      overlay.classList.toggle('hidden', !show);
    };

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('mobile-menu-btn').onclick = () => toggleMobile();
      renderAll();
      lucide.createIcons();
    });

    // SDK
    const defaultConfig = { 
      site_title: 'Python Course', 
      primary_color: '#10b981', 
      surface_color: '#1f2937', 
      text_color: '#d1d5db', 
      accent_color: '#6ee7b7', 
      bg_color: '#111827', 
      font_family: 'Source Sans 3', 
      font_size: 16 
    };

    function applyConfig(config) {
      document.getElementById('site-title').textContent = config.site_title || defaultConfig.site_title;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => applyConfig(config),
        mapToCapabilities: (config) => ({
          recolorables: [
            { get: () => config.bg_color || defaultConfig.bg_color, set: (v) => { config.bg_color = v; window.elementSdk.setConfig({ bg_color: v }); } },
            { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
            { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
            { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); } }
          ],
          borderables: [],
          fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
          fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
        }),
        mapToEditPanelValues: (config) => new Map([["site_title", config.site_title || defaultConfig.site_title]])
      });
    }
    function toggleMobile(){

  const sidebar = document.getElementById("mobile-sidebar");
  const overlay = document.getElementById("mobile-overlay");

  // OPEN
  if(sidebar.classList.contains("-translate-x-full")){

    sidebar.classList.remove("-translate-x-full");

    overlay.classList.remove("hidden");

  }

  // CLOSE
  else{

    sidebar.classList.add("-translate-x-full");

    overlay.classList.add("hidden");

  }

}

  </script>
 </body>
