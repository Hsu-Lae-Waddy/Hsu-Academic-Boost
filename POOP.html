  content: `
    <h2>🧩 What is Object-Oriented Programming?</h2>

    <p>
      <strong>OOP</strong> stands for <strong>Object-Oriented Programming</strong>.
      It is a programming style where we organize our code around
      <strong>objects</strong>.
    </p>

    <p>
      An object can contain <strong>data</strong> (attributes) and
      <strong>actions</strong> (methods).
    </p>

    <hr>

    <h3>💡 What is OOP?</h3>

    <p>
      In OOP, we model things in our program as
      <strong>objects</strong>.
    </p>

    <p>
      For example, in a school program, we might have:
    </p>

    <ul>
      <li>👩‍🎓 Student</li>
      <li>👨‍🏫 Teacher</li>
      <li>📚 Book</li>
      <li>🏫 School</li>
    </ul>

    <p>
      Each object can have its own information and actions.
    </p>

    <hr>

    <h3>🌎 Real-World Example</h3>

    <p>
      Think about a <strong>car</strong>.
    </p>

    <table>
      <tr>
        <th>Car Data</th>
        <th>Car Actions</th>
      </tr>

      <tr>
        <td>Color: Red</td>
        <td>Start()</td>
      </tr>

      <tr>
        <td>Brand: Toyota</td>
        <td>Stop()</td>
      </tr>

      <tr>
        <td>Speed: 60 km/h</td>
        <td>Accelerate()</td>
      </tr>
    </table>

    <p>
      In programming, we can represent this car as an
      <strong>object</strong>.
    </p>

    <hr>

    <h3>🤔 Why Do We Use OOP?</h3>

    <p>
      Imagine you are creating a large school management system.
      If all of your code is inside one huge file, it can become difficult
      to understand and maintain.
    </p>

    <p>
      OOP allows us to organize related data and actions together.
    </p>

    <div class="code-block">Student
│
├── name
├── age
├── grade
│
├── study()
├── attend_class()
└── show_info()</div>

    <p>
      Everything related to a student can be organized inside the
      <strong>Student class</strong>.
    </p>

    <hr>

    <h3>🔄 Procedural Programming vs OOP</h3>

    <p>
      There are different ways to organize a program.
      Two common approaches are <strong>procedural programming</strong>
      and <strong>object-oriented programming</strong>.
    </p>

    <h4>📋 Procedural Programming</h4>

    <p>
      Procedural programming organizes code mainly around
      <strong>functions and procedures</strong>.
    </p>

    <div class="code-block">students = ["Alice", "Bob", "Charlie"]

def show_student(name):
    print("Student:", name)

show_student(students[0])</div>

    <h4>🧩 Object-Oriented Programming</h4>

    <p>
      OOP organizes code around <strong>objects and classes</strong>.
    </p>

    <div class="code-block">class Student:

    def __init__(self, name):
        self.name = name

    def show_info(self):
        print("Student:", self.name)


student1 = Student("Alice")

student1.show_info()</div>

    <table>

        <th>OOP</th>

      <tr>

      </tr>

      <tr>

        <td>Name, age, breed</td>
        <td>Eat, sleep, bark</td>
      </tr>
    </table>

    <hr>

    <h3>📐 Classes and Objects</h3>

    <p>
      Two important words in OOP are <strong>class</strong> and
      <strong>object</strong>.
    </p>

    <h4>📐 Class = Blueprint</h4>

    <p>
      A <strong>class</strong> is like a blueprint or template for creating objects.
    </p>

    <p>
      Think about a house blueprint 🏠.
      The blueprint describes how the house should be built,
      but the blueprint itself is not the actual house.
    </p>

    <h4>🏠 Object = Actual Thing</h4>

    <p>
      An <strong>object</strong> is an actual instance created from a class.
    </p>

    <div class="code-block">class Student:
    pass


student1 = Student()
student2 = Student()</div>

    <p>
      Here:
    </p>

    <ul>
      <li><code>Student</code> → Class 📐</li>
      <li><code>student1</code> → Object 👩‍🎓</li>
      <li><code>student2</code> → Object 👩‍🎓</li>
    </ul>

    <div class="code-block">Student Class
        📐 Blueprint
             │
       ┌─────┴─────┐
       ↓           ↓
   student1     student2
   👩‍🎓 Alice     👨‍🎓 Bob</div>

    <hr>

    <h3>⭐ OOP Advantages</h3>

    <ul>
      <li>
        <strong>♻️ Reusability</strong> —
        Create a class once and create many objects from it.
      </li>

      <li>
        <strong>🧹 Organization</strong> —
        Keep related data and methods together.
      </li>

      <li>
        <strong>🔒 Encapsulation</strong> —
        Control how data is accessed and modified.
      </li>

      <li>
        <strong>🧬 Inheritance</strong> —
        Create new classes based on existing classes.
      </li>

      <li>
        <strong>🔄 Polymorphism</strong> —
        Allow different objects to respond to the same method in different ways.
      </li>

      <li>
        <strong>🛠️ Easier Maintenance</strong> —
        Large programs can be easier to update and manage.
      </li>
    </ul>

    <hr>

    <h3>🧠 Easy Memory Trick</h3>

    <div class="code-block">Class  = 📐 Blueprint

Object = 🏠 Actual Thing

Attribute = 📋 Information

Method = ⚙️ Action</div>

    <p>
      For example:
    </p>

    <div class="code-block">class Dog:

    # Attribute
    name = "Buddy"

    # Method
    def bark(self):
        print("Woof!")</div>

    <table>
      <tr>
        <th>OOP Concept</th>
        <th>Simple Meaning</th>
      </tr>

      <tr>
        <td>Class</td>
        <td>📐 Blueprint for objects</td>
      </tr>

      <tr>
        <td>Object</td>
        <td>🏠 An instance of a class</td>
      </tr>

      <tr>
        <td>Attribute</td>
        <td>📋 Object's data</td>
      </tr>

      <tr>
        <td>Method</td>
        <td>⚙️ Object's action</td>
      </tr>
    </table>

    <hr>

    <h3>🎯 Try It Yourself</h3>

    <p>
      Think of something from your everyday life and identify its
      <strong>data</strong> and <strong>actions</strong>.
    </p>

    <p>For example, choose:</p>

    <ul>
      <li>🚗 Car</li>
      <li>🐕 Dog</li>
      <li>📱 Phone</li>
      <li>🎮 Game Character</li>
      <li>👩‍🎓 Student</li>

    <p>
      Then answer:
    </p>

    <ol>
      <li>What information does it have?</li>
      <li>What actions can it perform?</li>
      <li>What could its class be called?</li>
    </ol>

    <hr>

    <h3>📚 Summary</h3>

    <p>
      <strong>Object-Oriented Programming (OOP)</strong> is a programming
      approach that organizes programs around objects.
    </p>

    <p>
      Objects contain <strong>data</strong> and can perform
      <strong>actions</strong>. A <strong>class</strong> acts as a blueprint
      for creating objects.
    </p>

    <p>
      The main goal is to make programs more
      <strong>organized, reusable, maintainable, and easier to manage</strong>.
    </p>
  `

    <h2>🔴 Python __init__() Method</h2>

    <h3>🏗️ What is __init__()?</h3>

    <p>
      The <code>__init__()</code> method is a special method in a Python class.
      It runs <strong>automatically</strong> when a new object is created.
    </p>

    <p>
      We commonly use it to give an object its initial data.
    </p>

    <div class="code-block">class Student:

    def __init__(self):
        print("A student object was created!")


student1 = Student()</div>

    <strong>Output:</strong>

    <div class="code-block">A student object was created!</div>

    <p>
      Notice that we did not call <code>__init__()</code> ourselves.
      Python called it automatically when we wrote:
    </p>

    <div class="code-block">student1 = Student() </div>

    <hr>

    <h3>🎯 Why Do We Use __init__()?</h3>

    <p>
      Without <code>__init__()</code>, we would have to manually add
      information to every object.
    </p>

    <div class="code-block">class Student:
    pass

student1 = Student()

student1.name = "Alice"
student1.age = 12
student1.grade = 6</div>

    <p>
      This works, but it can become inconvenient when we create many objects.
    </p>

    <p>
      With <code>__init__()</code>, we can set the information when the
      object is created.
    </p>

    <div class="code-block">class Student:

    def __init__(self, name, age, grade):
        self.name = name
        self.age = age
        self.grade = grade


student1 = Student("Alice", 12, 6)
student2 = Student("Bob", 13, 7)</div>

    <hr>

    <h3>🧩 How Does It Work?</h3>

    <p>Look at this example:</p>

    <div class="code-block">class Student:

    def __init__(self, name, age):
        self.name = name
        self.age = age


student1 = Student("Alice", 12)</div>

    <p>When Python sees:</p>

    <div class="code-block">Student("Alice", 12)</div>

    <p>
      Python creates a new <code>Student</code> object and automatically
      calls:
    </p>

    <div class="code-block">__init__(self, "Alice", 12)</div>

    <p>
      Then these values are stored in the object:
    </p>

    <div class="code-block">self.name = "Alice"
self.age = 12</div>

    <hr>

    <p>
      <code>self</code> refers to the <strong>current object</strong>.
    </p>

    def __init__(self, name):
        self.name = name</div>

    <p>
      If we create:
    </p>

    <div class="code-block">student1 = Student("Alice")
student2 = Student("Bob")</div>

    <p>Python stores:</p>

    <div class="code-block">student1.name → "Alice"

student2.name → "Bob"</div>

    </p>

    <div class="code-block">class Student:

        print("Hello! I am a student.")

    <h3>👉 Why Does a Method Use <code>self</code>?</h3>
