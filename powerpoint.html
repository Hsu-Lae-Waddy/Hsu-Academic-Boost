body{

    font-family:'Segoe UI',sans-serif;
}

.lesson-grid{
    max-width:1400px;
    margin:auto;
    padding:40px 20px;
}

.lesson-card{
    background:white;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition:.3s;
    margin-bottom:40px;
}

.lesson-card:hover{
    transform:translateY(-5px);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px;

    background:linear-gradient(
        135deg,
        #0f766e,
        #14b8a6
    );

    color:white;
}

.card-header h2{
    font-size:1.5rem;
    font-weight:700;
}

.card-header p{
    opacity:.9;
    margin-top:5px;
}

.badge{
    background:white;
    color:#0f766e;

    padding:8px 14px;
    border-radius:999px;
    font-weight:600;
    white-space:nowrap;
}

.carousel-section{
    position:relative;
    padding:25px;
}

.carousel-wrapper{
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;

    border-radius:16px;
    background:#e2e8f0;
}

.carousel-images{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .4s ease;
}

.slide{
    min-width:100%;
    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:white;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);

    width:50px;
    height:50px;

    border:none;
    border-radius:50%;

    background:white;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    cursor:pointer;

    font-size:22px;
    z-index:10;

    transition:.2s;
}

.nav-btn:hover{
    transform:translateY(-50%) scale(1.08);
}

.nav-btn:active{
    transform:translateY(-50%) scale(.95);
}

.prev-btn{
    left:10px;
}

.next-btn{
    right:10px;
}

.card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 25px;

    border-top:1px solid #e2e8f0;
}

.slide-counter{
    font-weight:600;
    color:#475569;
}

.action-buttons{
    display:flex;
    gap:10px;
}

.download-btn{
    background:#0f172a;
    color:white;

    padding:10px 18px;
    border-radius:10px;

    text-decoration:none;

    transition:.2s;
}

.download-btn:hover{
    background:#1e293b;
}

@media(max-width:768px){

    .lesson-grid{
        padding:20px 12px;
    }

    .card-header{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .carousel-section{
        padding:15px;
    }

    .nav-btn{
        width:42px;
        height:42px;
        font-size:18px;
    }

    .prev-btn{
        left:5px;
    }

    .next-btn{
        right:5px;
    }

    .card-footer{
        flex-direction:column;
        gap:15px;
    }

}

</style>

<script>

document.querySelectorAll(".lesson-card").forEach(function(card){

    const slider =
        card.querySelector(".carousel-images");

    const slides =
        card.querySelectorAll(".slide");

    const prevBtn =
        card.querySelector(".prev-btn");

    const nextBtn =
        card.querySelector(".next-btn");

    const currentSlide =
        card.querySelector(".current-slide");

    const totalSlides =
        card.querySelector(".total-slides");


    let currentIndex = 0;


    // Set total slide number automatically
    totalSlides.textContent = slides.length;


    // Update carousel
    function updateCarousel(){

        slider.style.transform =
            `translateX(-${currentIndex * 100}%)`;

        currentSlide.textContent =
            currentIndex + 1;

    }


    // Next button
    nextBtn.addEventListener("click", function(){

        currentIndex =
            (currentIndex + 1) % slides.length;

        updateCarousel();

    });


    // Previous button
    prevBtn.addEventListener("click", function(){

        currentIndex =
            (currentIndex - 1 + slides.length)
            % slides.length;

        updateCarousel();

    });


    // Start carousel
    updateCarousel();

});

</script>
